spring.application.name=EnglishLearningProject
server.port=8080

spring.thymeleaf.cache=false

spring.config.import=optional:classpath:application-secret.properties

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=profile,email

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
server.forward-headers-strategy=framework

app.url=http://localhost:${server.port}

# External URL for public-facing links (password reset, etc.)
# Use ngrok domain or production URL here
app.external.url=${EXTERNAL_URL:}

# JWT Configuration (thay đổi secret trong production!)
app.jwt.secret=${JWT_SECRET:}
app.jwt.expiration-hours=24

# ImageKit Configuration
imagekit.public-key=${IMAGEKIT_PUBLIC_KEY:}
imagekit.private-key=${IMAGEKIT_PRIVATE_KEY:}
imagekit.url-endpoint=${IMAGEKIT_URL_ENDPOINT:}
# Audio paths for different purposes
# Base path for audio files
imagekit.audio-base-path=${IMAGEKIT_AUDIO_BASE_PATH:}
# Audio mẫu cho bài học (admin upload)
imagekit.audio-lessons-path=${IMAGEKIT_AUDIO_LESSONS_PATH:}
# Audio nói của người dùng (speaking practice)
imagekit.audio-speaking-path=${IMAGEKIT_AUDIO_SPEAKING_PATH:}
imagekit.image-base-path=${IMAGEKIT_IMAGE_BASE_PATH:}

# Groq API Configuration
groq.api.url=https://api.groq.com/openai/v1/chat/completions
groq.api.key=${GROQ_API_KEY:demo}

# Ngrok Configuration
ngrok.auth-token=${NGROK_AUTH_TOKEN:}
ngrok.domain=${NGROK_DOMAIN:}

# GZIP Compression
server.compression.enabled=true
server.compression.mime-types=application/json,application/xml,text/html,text/xml,text/plain
server.compression.min-response-size=1024
